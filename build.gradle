plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "humanised-baritone-test"
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Deterministic parser and scheduler checks, without launching Minecraft.
sourceSets {
	chatTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}
tasks.register('chatResponderTest', JavaExec) {
	dependsOn chatTestClasses
	classpath = sourceSets.chatTest.runtimeClasspath
	mainClass = 'com.humanisedbaritone.chat.ChallengeResponderTest'
}
tasks.named('check') { dependsOn 'chatResponderTest' }
